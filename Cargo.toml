[package]
name = "imsg-mcp"
version = "0.1.0"
edition = "2024"
description = "A Rust-based MCP server for iMessage"

[dependencies]
# MCP server SDK - using JSON-RPC 2.0 over stdio
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1.0"
anyhow = "1.0"
shellexpand = "3.1"
